<body>
    <div class="crud container">
        <div class="head text-center my-5">
            <h2 class="text-uppercase">crud</h2>
            <p class="text-uppercase">product management system</p>
        </div>


        <div class="inputs">
            <input class="w-100 border-0 text-white my-2 rounded p-4" style="outline: none; height: 30px;background-color: #111;"" type="text" placeholder="title" id="title">
            <div class="price d-flex flex-wrap justify-content-between align-items-center">
                <input onkeyup="getTotal();" class=" border-0 text-white my-2 rounded p-4" style="outline: none; width:20% ; height: 30px;background-color: #111;" type="number" placeholder="price" id="price">
                <input onkeyup="getTotal();" class=" border-0 text-white my-2 rounded p-4" style="outline: none; width:20% ; height: 30px;background-color: #111;" type="number" placeholder="taxes" id="taxes">
                <input onkeyup="getTotal();" class=" border-0 text-white my-2 rounded p-4" style="outline: none; width:20% ; height: 30px;background-color: #111;" type="number" placeholder="ads" id="ads">
                <input onkeyup="getTotal();" class=" border-0 text-white my-2 rounded p-4" style="outline: none; width:20% ; height: 30px;background-color: #111;" type="number" placeholder="discount" id="discount">
                <span class=" p-2 rounded" style="background: rgb(155, 4, 4);" id="total"></span>
            </div>
            <input class="w-100 border-0  text-white my-2 rounded p-4" style="outline: none; height: 30px;background-color: #111;" type="number" placeholder="count" id="count">
            <input class="w-100 border-0  text-white my-2 rounded p-4" style="outline: none; height: 30px;background-color: #111;" type="text" placeholder="category" id="category">
            <button class="text-capitalize p-2 inpbtn w-100 border-0 text-white-50 rounded " style="transition: 0.5s;background: #390053 ;height: 30px;" id="submit">create</button>
        </div>


        <div class="outputs">
            <div class="search-block">
                <input onkeyup="searchData(this.value);" class=" border-0  text-white-50 my-2 rounded p-4" style="width: 100%;outline: none; height: 30px;background-color: #111;" type="text" placeholder="search" id="search">
                <div class="btn-search d-flex justify-content-between">
                    <button onclick="getSearchMode(this.id);" class="text-capitalize inpbtn border-0 text-white-50 p-2 rounded" style="width: 45%; transition: 0.5s;background: #390053 ;height: 30px;" id="search-title">search by title</button>
                    <button onclick="getSearchMode(this.id);" class="text-capitalize inpbtn border-0 text-white-50 p-2 rounded" style="width: 45%; transition: 0.5s;background: #390053 ;height: 30px;" id="search-category">search by category</button>
                </div>
            </div>
            <div id="delete-all">
                    
            </div>
            <div style="overflow-x: auto;">
            <table class="text-capitalize w-100 text-center my-4">
                <tr class="text-uppercase">
                    <th class="p-3">id</th>
                    <th class="p-3">title</th>
                    <th class="p-3">price</th>
                    <th class="p-3">taxes</th>
                    <th class="p-3">ads</th>
                    <th class="p-3">discount</th>
                    <th class="p-3">total</th>
                    <th class="p-3">category</th>
                    <th class="p-3">update</th>
                    <th class="p-3">delete</th>
                </tr>
